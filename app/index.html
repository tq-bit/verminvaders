<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verminvaders</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
<main class="stage">
  <canvas id="game" width="480" height="600"></canvas>
  <aside id="strategy-panel" class="strategy" hidden aria-live="polite">
    <header class="strategy__header">
      <h2 class="strategy__title">Current Strategy</h2>
      <p class="strategy__status"><span class="strategy__dot" aria-hidden="true"></span><span class="strategy__status-text">Thinking about tuna</span></p>
    </header>
    <pre id="strategy-body" class="strategy__body"></pre>
  </aside>
  <aside id="thinking-panel" class="thinking" hidden aria-live="polite">
    <header class="thinking__header">
      <h2 class="thinking__title">Le Chonk's thoughts</h2>
      <p class="thinking__status"><span class="thinking__dot" aria-hidden="true"></span><span class="thinking__status-text">thinking</span></p>
    </header>
    <pre id="thinking-body" class="thinking__body"></pre>
  </aside>
</main>
<div class="hint">Click the game once so it can hear your keyboard.</div>
<script src="game.js"></script>
</body>
</html>
